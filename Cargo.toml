[package]
name = "secureshare_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = "11.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "runtime-async-std", "tls-native-tls", "uuid"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tower = "0.5.3"
time = "0.3.55"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing-subscriber = "0.3.23"
aes = "0.9.3"
block-modes = "0.9.1"
rand = "0.10.2"
rsa = "0.9.10"
base64 = "0.23.1"
dotenvy_macro = "0.15.7" 
