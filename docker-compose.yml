# docker-compose.yml
services:
  database:
    image: postgres:alpine
    container_name: local-postgres-secure-project
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: file_share
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
